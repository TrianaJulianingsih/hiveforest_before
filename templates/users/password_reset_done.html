{% extends '../includes/base.html' %}
{% load static i18n %}

{% block title %}
  Forgot Password
{% endblock %}
{% block body_class %}
  login-page
{% endblock %}

{% block content %}
  <div class="card">
    <div class="card-body login-card-body">
      <div class="alert alert-success">
        <strong>
          If an account exists with this email, a reset link has been sent.
          <a href="{% url 'login' %}">Reload here</a>.
        </strong>
      </div>
    </div>
  </div>
{% endblock %}
