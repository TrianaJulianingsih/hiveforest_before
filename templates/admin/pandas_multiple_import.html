{% extends "admin/base_site.html" %}
{% block content %}
  <h1>Import Data with Pandas</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <p>
      <label for="file">Upload a CSV/XLS/XLXS/DBF file:</label>
      <input type="file" name="files" id="file" multiple>
      <br>
    </p>
    <button type="submit" class="button">Upload</button>
  </form>
  <p><a href="..">Back to {{ opts.verbose_name_plural }}</a></p>
{% endblock %}

<script>
document.addEventListener("DOMContentLoaded", function() {
    let form = document.querySelector("form");
    if (form) {
        form.addEventListener("submit", function(event) {
            event.preventDefault();
            let formData = new FormData(form);
            let fileInput = document.getElementById('file');

            for (let i=0; i < fileInput.files.length; i++) {
                formData.append('files', fileInput.files[i]);
            }

            fetch(window.location.href, {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.download_csv) {
                    window.location.href = "{% url 'download_missing_data' %}";  // ✅ Correct URL to download CSV
                } else {
                    window.location.href = "..";  // Redirect to list page
                }
            });
        });
    }
});
</script>
