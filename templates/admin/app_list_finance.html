<ul class="list-group striped-list hiveforest">
  <li class="list-group-item hiveforest">
    <h6 class="list-group hiveforest">Products</h6>
  </li>
  <li class="list-group-item hiveforest">
    <a href="{% url 'admin:finance_itemprice_changelist' %}"{% if model.admin_url in request.path|urlencode %} aria-current="page"{% endif %}>Item Prices</a>
  </li>
  <li class="list-group-item hiveforest">
    <h6 class="list-group hiveforest">Receivables</h6>
  </li>
    <li class="list-group-item hiveforest">
        <div class="d-inline">
            <form id="sync-form" action="{% url 'finance:sync_arbalance' %}" method="post" class="d-inline swal-ajax-form">
                {% csrf_token %}
                <button class="btn btn-primary btn-sm">Sync</button>
            </form>
            <a href="{% url 'admin:finance_arbalance_changelist' %}"{% if model.admin_url in request.path|urlencode %} aria-current="page"{% endif %}>MUP AR Balance</a> |
        </div>
        <div class="d-inline">
            <form id="sync-form" action="{% url 'finance:sync_arcollection' %}" method="post" class="d-inline swal-ajax-form">
                {% csrf_token %}
                <button class="btn btn-primary btn-sm">Sync</button>
            </form>
            <a href="{% url 'admin:finance_arcollection_changelist' %}"{% if model.admin_url in request.path|urlencode %} aria-current="page"{% endif %}>MUP AR Collection</a>
        </div>
    </li>
</ul>
