{% load i18n static %}
{% load admin_urls %}

{% if has_import_permission %}
<li>
    <a href='{% url opts|admin_urlname:"import" %}' class="import_link">
        <i class="fas fa-upload btn btn-sm btn-primary hiveforest" style="margin-right: 5px;" title="{% blocktranslate with cl.opts.verbose_name as name %} Import {{  name  }}{% endblocktranslate %}"></i>
        {% translate "Import" %}
    </a>
</li>
{% endif %}
