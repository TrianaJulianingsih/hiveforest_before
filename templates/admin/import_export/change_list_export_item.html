{% load i18n static %}
{% load admin_urls %}

{% if has_export_permission %}
<li>
    <a href="{% url opts|admin_urlname:'export' %}{{  cl.get_query_string  }}" class="export_link">
        <i class="fas fa-download btn btn-sm btn-primary hiveforest" style="margin-right: 5px;" title="{% blocktranslate with cl.opts.verbose_name as name %} Export {{  name  }}{% endblocktranslate %}"></i>
        {% translate "Export" %}
    </a>
</li>
{% endif %}
