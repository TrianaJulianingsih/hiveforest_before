
name: SonarQube Frontend Analysis

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  sonarqube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      
      - name: Prepare frontend analysis
        run: |
          mkdir -p sonar-frontend
          cp apps/humancapital/templates/learning_tracker/*.html sonar-frontend/

          cat > sonar-frontend/sonar-project.properties <<'EOF'
          sonar.projectKey=trianajulianingsih_hiveforest-frontend-learning-tracker
          sonar.organization=trianajulianingsih
          sonar.projectName=HiveForest Frontend Learning Tracker
          sonar.sourceEncoding=UTF-8
          EOF

          echo "Files for analysis:"
          find sonar-frontend -type f

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: sonar-frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
