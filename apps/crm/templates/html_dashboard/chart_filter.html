{% load static %}
<div class="chart-filter-root relative shrink-0" id="chart-filter-root-{{ key }}" data-key="{{ key }}">
  <button type="button" id="chart-filter-btn-{{ key }}" class="group relative flex items-center gap-2 pl-2 pr-3 h-10 bg-white border border-[#E1E4EA] rounded-xl shadow-sm text-sm font-medium text-[#323743] hover:bg-gray-50" title="Filter {{ label }}">
    <span class="w-7 h-7 shrink-0 rounded-lg bg-white group-hover:bg-gray-50 flex items-center justify-center text-[#6f7787]">
      <img src="{% static 'custom/crm/analytics_dashboard/assets/IMG_4.svg' %}" alt="" class="w-3.5 h-3.5">
    </span>
    <span class="whitespace-nowrap">{{ label }}</span>
    {% if selected %}<span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-[#636AE8] text-white text-xs font-semibold">{{ selected|length }}</span>{% endif %}
    <svg class="w-4 h-4 text-[#9095a1] shrink-0" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <div id="chart-filter-popover-{{ key }}" class="hidden absolute right-0 top-full mt-2 w-[240px] bg-white border border-[#E1E4EA] rounded-[10px] dropdown-shadow z-30 overflow-hidden p-4 text-left">
    <div class="flex items-center justify-between mb-3">
      <span class="text-sm font-bold text-[#171a1f]">{{ label }}</span>
      <a href="{{ reset_url }}" class="text-xs font-medium text-[#636AE8] hover:underline">Reset</a>
    </div>
    <input type="text" class="chart-filter-search w-full h-9 px-3 mb-2 bg-[#f3f4f6] rounded-md text-sm border-none focus:outline-none focus:ring-2 focus:ring-[#636AE8]" placeholder="Search" data-list="chart-filter-options-{{ key }}">
    <div id="chart-filter-options-{{ key }}" class="max-h-[220px] overflow-y-auto space-y-1">
      {% for option in options %}
      <label class="chart-filter-option font-normal flex items-center justify-between py-1.5 px-2 rounded-md hover:bg-gray-50 cursor-pointer">
        <span class="text-sm text-[#323743]">{{ option }}</span>
        <input type="checkbox" name="{{ field }}" value="{{ option }}" {% if option in selected %}checked{% endif %} class="w-4 h-4 rounded accent-[#636AE8]">
      </label>
      {% endfor %}
    </div>
    <button type="submit" class="mt-3 w-full h-9 rounded-md bg-[#636AE8] text-white text-sm font-medium hover:bg-[#5259d6]">Confirm</button>
  </div>
</div>
