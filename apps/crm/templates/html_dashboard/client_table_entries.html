{% load static %}
<div class="flex flex-wrap items-center gap-3">
  <div class="relative" data-filter-root data-filter-column="{{  filter_column  }}">
    <button type="button" data-filter-toggle class="flex items-center gap-2 h-8 px-3 bg-white border border-[#dee1e6] rounded-md text-sm text-[#424856] hover:bg-gray-50">
      <img src="{% static 'custom/crm/hospital_profile/assets/IMG_5.svg' %}" alt="" class="w-4 h-4">
      <span>{{  t.btn_filter|default:'Filter'  }}</span>
      <span data-filter-count class="items-center justify-center w-5 h-5 rounded-full bg-[#636AE8] text-white text-xs font-semibold" style="display: none;"></span>
    </button>
    <div data-filter-panel class="hidden absolute right-0 top-full mt-2 w-64 bg-white border border-[#dee1e6] rounded-[10px] shadow-lg z-30 overflow-hidden p-4 text-left">
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm font-bold text-[#171a1f]">{{  filter_label  }}</span>
        <button type="button" data-filter-reset class="text-xs font-medium text-[#636AE8] hover:underline">{{  t.btn_reset|default:'Reset'  }}</button>
      </div>
      <div class="relative mb-2">
        <svg class="w-4 h-4 text-[#9095a1] absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/>
          <path d="M17 17L13.5 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input type="text" data-filter-search placeholder="{{  t.filter_search_placeholder|default:'Search'  }}" class="w-full h-9 pl-8 pr-3 bg-[#f3f4f6] rounded-md text-sm border-none focus:outline-none focus:ring-2 focus:ring-[#636AE8]/20">
      </div>
      <div data-filter-options class="max-h-[220px] overflow-y-auto space-y-1"></div>
      <button type="button" data-filter-confirm class="mt-3 w-full h-9 rounded-md bg-[#636AE8] text-white text-sm font-medium hover:bg-[#5259d6]">{{  t.btn_confirm|default:'Confirm'  }}</button>
    </div>
  </div>
  <div class="flex items-center gap-2 text-sm text-[#6F7787]">
    <span>{{  t.label_show|default:'Show'  }}</span>
    <div class="relative">
      <select data-page-size-select class="h-8 pl-2.5 pr-7 rounded-md border border-[#dee1e6] text-sm text-[#323743] bg-white focus:outline-none focus:ring-2 focus:ring-[#636AE8]/20 appearance-none">
        <option value="10" selected>10</option>
        <option value="25">25</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="500">500</option>
        <option value="all">{{  t.label_all|default:'All'  }}</option>
      </select>
      <svg class="w-3.5 h-3.5 text-[#9095a1] absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span>{{  t.label_entries|default:'entries'  }}</span>
  </div>
</div>
